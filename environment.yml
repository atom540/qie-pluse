name: ai-risk-oracle
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1
  - pip
  - pip:
    # Core ML Libraries
    - transformers>=4.21.0
    - datasets>=2.0.0
    - accelerate>=0.20.0
    - xgboost>=1.7.0
    - scikit-learn>=1.3.0
    - pandas>=2.0.0
    - numpy>=1.24.0
    # API Client Libraries
    - requests>=2.31.0
    - yfinance>=0.2.18
    - python-binance>=1.0.19
    - tweepy>=4.14.0
    - telethon>=1.29.0
    - alpha-vantage>=2.3.1
    - pycoingecko>=3.1.0
    - praw>=7.7.1
    # Web Service Framework
    - fastapi>=0.103.0
    - uvicorn[standard]>=0.23.0
    - aiohttp>=3.8.5
    # Blockchain Integration
    - web3>=6.9.0
    # Testing Frameworks
    - hypothesis>=6.82.0
    - pytest>=7.4.0
    - pytest-asyncio>=0.21.0
    # Environment and Configuration
    - python-dotenv>=1.0.0
    - python-dateutil>=2.8.2
    - pytz>=2023.3
    # Logging and Monitoring
    - structlog>=23.1.0
    - prometheus-client>=0.17.1
    # Development Tools
    - black>=23.7.0
    - flake8>=6.0.0
    - mypy>=1.5.0
    - pre-commit>=3.3.0